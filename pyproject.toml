[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "retranscription"
version = "0.3.0"
description = "Retranscription de réunions sans IA générative (wav2vec 2.0 + CTC, pyannote/WeSpeaker en ONNX, validation WER/DER)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "vosk>=0.3.44",
    "av>=12.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "jiwer>=3.0",
    "onnxruntime>=1.17",
]

[project.optional-dependencies]
tests = ["pympi-ling>=1.70", "pyannote.metrics>=3.2"]

[project.scripts]
retranscription = "retranscription.__main__:_lancer"

[tool.setuptools]
packages = ["retranscription"]

[tool.setuptools.package-data]
retranscription = ["donnees/w2v_mini/*"]
