# Préparation des modèles neuronaux et du modèle de langue (à la main).
#
# Onglet « Actions » > « Préparer les modèles » > « Run workflow ».
#
# Le workflow :
#   1. convertit le modèle wav2vec 2.0 français au format ONNX (32 bits et
#      8 bits), en vérifiant que les sorties sont identiques à celles de
#      PyTorch — seulement si ce n'est pas déjà fait (20 à 40 minutes) ;
#   2. récupère le modèle de langue 5-grammes publié avec ce modèle
#      (KenLM, environ 1 Go) ;
#   3. récupère les modèles de segmentation (pyannote 3.0) et d'empreintes
#      vocales (WeSpeaker ResNet34), déjà au format ONNX ;
#   4. publie les fichiers manquants sur la page « modeles-1 » du dépôt
#      (rubrique Releases).
#
# L'application télécharge ensuite ces fichiers au premier lancement,
# sans PyTorch ni compte Hugging Face.

name: Préparer les modèles

on:
  workflow_dispatch:
    inputs:
      modele:
        description: "Modèle wav2vec 2.0 + CTC (Hugging Face)"
        default: "bofenghuang/asr-wav2vec2-ctc-french"
        required: true
      tout_refaire:
        description: "Tout refaire, même les fichiers déjà publiés"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  preparer:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONUTF8: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fichiers déjà publiés
        id: deja
        run: |
          if gh release view modeles-1 --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' > publies.txt 2>/dev/null; then
            cat publies.txt
          else
            : > publies.txt
            echo "(page modeles-1 absente)"
          fi
          a_faire() { if [ "${{ inputs.tout_refaire }}" = "true" ] || ! grep -qx "$1" publies.txt; then echo true; else echo false; fi; }
          echo "w2v=$(a_faire wav2vec2-fr-int8.zip)" >> "$GITHUB_OUTPUT"
          echo "lm=$(a_faire lm-fr-5gram.zip)" >> "$GITHUB_OUTPUT"
          echo "diar=$(a_faire wespeaker-resnet34.onnx)" >> "$GITHUB_OUTPUT"

      - name: Libérer de la place sur le disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
          mkdir -p modeles_export

      - name: Installer PyTorch (version processeur) et les outils de conversion
        if: steps.deja.outputs.w2v == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install "torch==2.14.*" --index-url https://download.pytorch.org/whl/cpu
          pip install -r outils/requirements-export.txt

      - name: Convertir wav2vec 2.0 au format ONNX
        if: steps.deja.outputs.w2v == 'true'
        run: python outils/exporter_wav2vec2.py --modele "${{ inputs.modele }}" --sortie modeles_export --zip

      - name: Récupérer le modèle de langue 5-grammes
        if: steps.deja.outputs.lm == 'true'
        run: |
          HF="https://huggingface.co/${{ inputs.modele }}/resolve/main/language_model"
          mkdir -p modeles_export/lm-fr-5gram
          for f in lm_5gram_big.bin unigrams.txt attrs.json; do
            curl -fL --retry 3 -o "modeles_export/lm-fr-5gram/$f" "$HF/$f"
          done
          cat modeles_export/lm-fr-5gram/attrs.json
          printf '%s\n' \
            "Modèle de langue 5-grammes (KenLM) publié avec ${{ inputs.modele }}" \
            "Source : https://huggingface.co/${{ inputs.modele }}/tree/main/language_model" \
            "Licence : celle du dépôt source (Apache 2.0 pour le modèle par défaut)." \
            > modeles_export/lm-fr-5gram/LISEZMOI.txt
          ls -la modeles_export/lm-fr-5gram

      - name: Vérifier le modèle de langue
        if: steps.deja.outputs.lm == 'true'
        run: |
          pip install numpy
          pip install --no-deps pyctcdecode==0.5.0 "pygtrie>=2.1,<3"
          pip install kenlm
          python - <<'EOF'
          import json, kenlm
          m = kenlm.Model("modeles_export/lm-fr-5gram/lm_5gram_big.bin")
          bon = m.score("il faut d'abord parler de la logistique", bos=True, eos=True)
          mauvais = m.score("il faut da bord parle de la logiqie", bos=True, eos=True)
          print("ordre", m.order, "| phrase correcte", round(bon, 2), "| phrase fautive", round(mauvais, 2))
          assert bon > mauvais
          EOF
          cd modeles_export && zip -r -0 lm-fr-5gram.zip lm-fr-5gram && ls -la lm-fr-5gram.zip

      - name: Récupérer les modèles de diarisation
        if: steps.deja.outputs.diar == 'true'
        run: |
          K2=https://github.com/k2-fsa/sherpa-onnx/releases/download
          curl -fL -o seg.tar.bz2 "$K2/speaker-segmentation-models/sherpa-onnx-pyannote-segmentation-3-0.tar.bz2"
          tar xjf seg.tar.bz2
          cp sherpa-onnx-pyannote-segmentation-3-0/model.onnx modeles_export/segmentation-3.0.onnx
          cp sherpa-onnx-pyannote-segmentation-3-0/LICENSE modeles_export/LICENCE-segmentation-3.0.txt
          curl -fL -o modeles_export/wespeaker-resnet34.onnx \
            "$K2/speaker-recongition-models/wespeaker_en_voxceleb_resnet34_LM.onnx"

      - name: Vérifier les modèles convertis avec l'application
        if: steps.deja.outputs.w2v == 'true'
        env:
          RETRANSCRIPTION_MODELES: ${{ github.workspace }}/modeles_export
        run: |
          pip install -r requirements.txt
          python -m retranscription.autotest rapport.txt
          python - <<'EOF'
          import numpy as np
          from retranscription.asr_w2v import TranscripteurW2V
          for nom in ("wav2vec2-fr", "wav2vec2-fr-int8"):
              t = TranscripteurW2V(f"modeles_export/{nom}")
              x = (np.random.default_rng(0).standard_normal(16000 * 70) * 300).astype("<i2")
              ids, probs = t.trames(x)
              print(nom, ": trames", len(ids), "attendu", len(x) // t.ept)
              assert abs(len(ids) - len(x) // t.ept) <= 2
          EOF

      - name: Publier sur la page « modeles-1 »
        run: |
          if ! gh release view modeles-1 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create modeles-1 --repo "$GITHUB_REPOSITORY" --title "Modèles (ne pas supprimer)" \
              --notes-file outils/NOTES_MODELES.md --latest=false
          else
            gh release edit modeles-1 --repo "$GITHUB_REPOSITORY" --notes-file outils/NOTES_MODELES.md
          fi
          fichiers=$(ls modeles_export/wav2vec2-fr.zip modeles_export/wav2vec2-fr-int8.zip \
                        modeles_export/lm-fr-5gram.zip modeles_export/segmentation-3.0.onnx \
                        modeles_export/wespeaker-resnet34.onnx modeles_export/LICENCE-segmentation-3.0.txt \
                        2>/dev/null || true)
          if [ -n "$fichiers" ]; then
            gh release upload modeles-1 --repo "$GITHUB_REPOSITORY" --clobber $fichiers
          else
            echo "Rien de nouveau à publier."
          fi
          gh release view modeles-1 --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[] | "\(.name)  \(.size)"'
