# Fabrication automatique de l'application pour Windows et Mac.
#
# Se déclenche à chaque dépôt de fichiers sur la branche principale, ou à la
# main (onglet « Actions » > « Fabriquer l'application » > « Run workflow »).
# Les deux fichiers .zip à partager se téléchargent en bas de la page de
# l'exécution, rubrique « Artifacts ».
#
# Pour publier une version téléchargeable par tous : page « Releases » >
# « Create a new release » (étiquette v0.2.0 par exemple) > « Publish release ».
# Les deux .zip sont alors ajoutés automatiquement à cette page.

name: Fabriquer l'application

on:
  push:
    branches: [main, master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fabriquer:
    name: ${{ matrix.nom }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            nom: Retranscription-Windows
          - os: macos-14            # Mac à puce Apple (M1 à M4)
            nom: Retranscription-Mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller markdown

      - name: Tests rapides
        run: python tests/test_vosk_simule.py

      - name: Guide en HTML
        run: python outils/guide_html.py

      - name: Fabriquer l'application
        run: pyinstaller --noconfirm retranscription.spec

      - name: Vérifier l'application fabriquée (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\Retranscription\Retranscription.exe" `
                -ArgumentList "--verifier", "$PWD\rapport.txt" -Wait -PassThru
          Get-Content rapport.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Vérifier l'application fabriquée (Mac)
        if: runner.os == 'macOS'
        run: |
          dist/Retranscription.app/Contents/MacOS/Retranscription --verifier "$PWD/rapport.txt"
          cat rapport.txt

      - name: Compresser (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item GUIDE_UTILISATEUR.html dist\Retranscription\
          Compress-Archive -Path dist\Retranscription -DestinationPath "${{ matrix.nom }}.zip"

      - name: Compresser (Mac)
        if: runner.os == 'macOS'
        run: |
          mkdir -p livraison/Retranscription
          cp -R dist/Retranscription.app livraison/Retranscription/
          cp GUIDE_UTILISATEUR.html livraison/Retranscription/
          ditto -c -k --keepParent livraison/Retranscription "${{ matrix.nom }}.zip"

      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.nom }}
          path: ${{ matrix.nom }}.zip
          retention-days: 90

  publier:
    name: Ajouter les fichiers à la version
    if: github.event_name == 'release'
    needs: fabriquer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: paquets
          merge-multiple: true
      - name: Joindre les deux .zip à la page de version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" paquets/*.zip \
            --repo "$GITHUB_REPOSITORY" --clobber
